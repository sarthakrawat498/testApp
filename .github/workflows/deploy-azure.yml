name: Build and deploy Backend2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify production files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f dist/server.js

      - name: Prepare deployment package
        run: |
          mkdir release
          cp package.json package-lock.json release/
          cp -r dist release/
          cd release
          npm ci --omit=dev --ignore-scripts

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: release
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: release

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service runtime settings
        run: |
          RESOURCE_GROUP=$(az webapp list --query "[?name=='TestAppBackend'].resourceGroup | [0]" -o tsv)
          echo "Resource group: $RESOURCE_GROUP"

          az webapp config appsettings set \
            --name TestAppBackend \
            --resource-group "$RESOURCE_GROUP" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false \
            --output none

          az webapp config set \
            --name TestAppBackend \
            --resource-group "$RESOURCE_GROUP" \
            --startup-file "npm start" \
            --output none

          echo "Waiting for setting to take effect..."
          for i in $(seq 1 10); do
            CURRENT_VALUE=$(az webapp config appsettings list \
              --name TestAppBackend \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" \
              -o tsv)
            echo "Attempt $i: SCM_DO_BUILD_DURING_DEPLOYMENT=$CURRENT_VALUE"
            if [ "$CURRENT_VALUE" = "false" ]; then
              break
            fi
            sleep 5
          done

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: TestAppBackend
          package: release
